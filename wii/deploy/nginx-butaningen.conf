# TLS 終端して bot(127.0.0.1:10000) へ渡す。acme.sh の install-cert が
# 下の ssl_certificate / ssl_certificate_key を配置・更新する。
# /etc/nginx/ 配下に置き、http{} から include する（Arch は nginx.conf の
# http ブロックで include するか conf.d を使う）。

server {
    listen 80;
    listen [::]:80;
    server_name your-name.duckdns.org;
    # acme.sh を webroot モードで使う場合のみ必要。DNS-01(dns_duckdns)なら
    # 80 番は不要。とりあえず https へ誘導。
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-name.duckdns.org;

    ssl_certificate     /etc/nginx/certs/butaningen.crt;
    ssl_certificate_key /etc/nginx/certs/butaningen.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # LINE webhook は署名検証のため生ボディをそのまま渡す。
    location / {
        proxy_pass http://127.0.0.1:10000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
